<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iria & Alberto</title>

<style>

/* =========================
   BODY
========================= */

body {

  margin: 0;

  font-family: 'Georgia', serif;

  background-color: #f5f1ea;

  background-image:
    linear-gradient(
      rgba(255,255,255,0.72),
      rgba(255,255,255,0.72)
    ),
    url('https://www.transparenttextures.com/patterns/handmade-paper.png');

  color: #3b3028;

  text-align: center;
}

/* =========================
   NAV
========================= */

nav {

  background: rgba(255,255,255,0.92);

  padding: 22px;

  border-bottom: 1px solid #ddd3c7;

  position: sticky;

  top: 0;

  z-index: 100;

  backdrop-filter: blur(8px);
}

nav a {

  margin: 0 20px;

  text-decoration: none;

  color: #55624f;

  letter-spacing: 2px;

  font-size: 13px;

  text-transform: uppercase;

  transition: 0.3s;
}

nav a:hover {

  opacity: 0.7;
}

/* =========================
   SECCIONES
========================= */

section {

  display: none;

  padding: 30px 24px 60px;

  max-width: 1100px;

  margin: auto;
}

.active {

  display: block;
}

/* =========================
   HERO
========================= */

.hero {

  position: relative;

  width: 100%;

  height: 72vh;

  min-height: 520px;

  max-height: 900px;

  overflow: hidden;

  border-radius: 24px;

  margin-top: 20px;

  background: transparent;
}

/* =========================
   SLIDES
========================= */

.slide {

  position: absolute;

  inset: 0;

  opacity: 0;

  transition: opacity 1.6s ease;
}

.slide.active {

  opacity: 1;
}

.slide img {

  width: 100%;

  height: 100%;

  object-fit: contain;

  object-position: center;

  border-radius: 24px;

  background: transparent;
}

/* =========================
   TITULOS
========================= */

h1 {

  font-size: 3.6em;

  margin-top: 42px;

  margin-bottom: 8px;

  font-weight: normal;

  color: #4d3b34;
}

h2 {

  color: #55624f;

  font-weight: normal;

  letter-spacing: 1px;
}

.section-title {

  font-size: 1.8em;

  color: #7a3e3e;

  margin-top: 60px;

  margin-bottom: 24px;

  display: inline-block;

  border-bottom: 1px solid #cbb7aa;

  padding-bottom: 8px;

  letter-spacing: 3px;

  font-weight: normal;

  text-transform: uppercase;
}

/* =========================
   TEXTOS
========================= */

.details {

  margin-top: 30px;

  line-height: 1.9;

  font-size: 1.05em;
}

/* =========================
   TARJETAS
========================= */

.card {

  background: rgba(255,255,255,0.92);

  padding: 42px;

  border-radius: 22px;

  border: 1px solid #e5ddd3;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.05);

  margin-top: 40px;
}

/* =========================
   MAPA
========================= */

.map-container {

  margin-top: 60px;
}

.map-container img {

  width: 100%;

  max-width: 760px;

  border-radius: 18px;

  box-shadow:
    0 6px 24px rgba(0,0,0,0.08);
}

/* =========================
   FORM
========================= */

iframe {

  border: none;

  border-radius: 16px;

  margin-top: 20px;
}

/* =========================
   HOTELES
========================= */

.hoteles-texto {

  margin-top: 25px;

  line-height: 1.9;

  font-size: 1.05em;
}

.hotel-card {

  background: rgba(255,255,255,0.96);

  border: 1px solid #e5ddd3;

  border-radius: 22px;

  overflow: hidden;

  margin-top: 28px;

  transition: 0.3s;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.05);
}

.hotel-card:hover {

  transform: translateY(-4px);
}

.hotel-link {

  display: flex;

  text-decoration: none;

  color: inherit;
}

.hotel-img {

  width: 38%;
}

.hotel-img img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;
}

.hotel-info {

  width: 62%;

  padding: 34px;

  text-align: left;

  display: flex;

  flex-direction: column;

  justify-content: center;

  min-width: 0;
}

.hotel-info h3 {

  margin-top: 0;

  margin-bottom: 12px;

  color: #55624f;

  font-size: 1.6em;

  font-weight: normal;
}

.hotel-direccion {

  line-height: 1.7;

  margin-bottom: 24px;
}

.codigo-box {

  background: #f5f1ea;

  padding: 18px;

  border-radius: 14px;

  border: 1px solid #ddd3c7;

  box-sizing: border-box;

  width: 100%;

  max-width: 100%;

  overflow-wrap: break-word;

  word-break: break-word;

  overflow: hidden;
}

.codigo-box strong {

  display: block;

  margin-bottom: 8px;
}

/* =========================
   DECORACIÓN
========================= */

.olive {

  position: fixed;

  width: 150px;

  opacity: 0.08;

  z-index: 0;

  pointer-events: none;
}

.top {

  top: 30px;

  left: 10px;
}

.bottom {

  bottom: 30px;

  right: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  nav {

    padding: 18px;
  }

  nav a {

    margin: 0 10px;

    font-size: 11px;
  }

  section {

    padding: 20px 16px 40px;
  }

  .hero {

    height: 62vh;

    min-height: 420px;
  }

  .slide img {

    object-fit: cover;

    object-position: center 20%;
  }

  h1 {

    font-size: 2.4em;
  }

  .section-title {

    font-size: 1.4em;
  }

  .card {

    padding: 28px 20px;
  }

  .olive {

    display: none;
  }

  .hotel-link {

    flex-direction: column;
  }

  .hotel-img,
  .hotel-info {

    width: 100%;
  }

  .hotel-img {

    height: 240px;
  }

  .hotel-info {

    padding: 24px;
  }

  .codigo-box {

    padding: 16px;

    font-size: 0.95em;

    width: 100%;

    max-width: 100%;

    box-sizing: border-box;

    overflow-wrap: break-word;

    word-break: break-word;

    overflow: hidden;
  }
}

</style>
</head>
