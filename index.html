<style>

/* =========================
   BODY
========================= */

body {

  margin: 0;

  font-family: 'Georgia', serif;

  background-color: #f5f1ea;

  background-image:
    linear-gradient(
      rgba(255,255,255,0.72),
      rgba(255,255,255,0.72)

  text-align: center;
}

/* =========================
   NAV
========================= */
   nav {
}

/* =========================
   SECCIONES
========================= */

section {

  display: none;

  opacity: 0;

  padding: 30px 24px 60px;

  max-width: 1100px;

  margin: auto;

  transition: opacity 0.45s ease;
}

.active {

  display: block;

  opacity: 1;
}

/* =========================
   HERO
========================= */

.hero {

  position: relative;

  width: 100%;

  height: 72vh;

  min-height: 520px;

  max-height: 900px;

  overflow: hidden;

  border-radius: 24px;

  margin-top: 20px;

  background: transparent;
}

/* =========================
   SLIDES
========================= */
.slide {

  margin-bottom: 24px;

  display: inline-block;

  border-bottom: 1px solid #cbb7aa;

  padding-bottom: 8px;

  letter-spacing: 3px;

  font-weight: normal;

  text-transform: uppercase;
}

/* =========================
   TEXTOS
========================= */

.details {

  margin-top: 30px;

  line-height: 1.9;

  font-size: 1.05em;
}

/* =========================
   TARJETAS
========================= */

.card {

  background: rgba(255,255,255,0.92);

  padding: 42px;

  border-radius: 22px;

  border: 1px solid #e5ddd3;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.05);

  margin-top: 40px;
}

/* =========================
   MAPA
========================= */

   .map-container {

  box-sizing: border-box;

  width: 100%;

  max-width: 100%;

  overflow-wrap: break-word;

  word-break: break-word;

  overflow: hidden;
}

.codigo-box strong {

  display: block;

  margin-bottom: 8px;
}

/* =========================
   DECORACIÓN
========================= */

.olive {

  position: fixed;

  width: 150px;

  opacity: 0.08;

  z-index: 0;

  pointer-events: none;
}

.top {

  top: 30px;

  left: 10px;
}

.bottom {

  bottom: 30px;

  right: 10px;
}

    <div class="slide">

    <div class="map-container">

</section>

<script>

function show(section) {

  document
    .querySelectorAll("section")
    .forEach(s => s.classList.remove("active"));

  document
    .getElementById(section)
    .classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

const slides = document.querySelectorAll('.slide');

let current = 0;

setInterval(() => {

  slides[current].classList.remove('active');

  current = (current + 1) % slides.length;

  slides[current].classList.add('active');

}, 4500);

</script>
